name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - { os: ubuntu-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        shell: bash
        run: |
          python -m hardn --version
          python -m hardn rules PY004
          python -m hardn examples/vulnerable-app --no-external --no-baseline -q --fail-on critical && exit 1 || echo "demo app correctly fails"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  dogfood:
    name: hardn scans itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m hardn . --no-external --fail-on low --sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardn-self-report
          path: .hardn/
          include-hidden-files: true
