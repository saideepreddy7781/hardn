name: release

on:
  push:
    # Version tags only (v0.1.0, v0.2.0rc1). Moving major tags for Action users (v0, v1) must not release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match hardn.__version__
        run: |
          v=$(python -c "import hardn; print(hardn.__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != version v$v"; exit 1; }
      - run: pip install build && python -m build
      - run: python scripts/build_pyz.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, asset: hardn-linux-x86_64 }
          - { os: macos-latest, asset: hardn-macos-arm64 }
          - { os: windows-latest, asset: hardn-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name hardn --paths . packaging/entry.py
      - name: Smoke test and rename
        shell: bash
        run: |
          bin=dist/hardn; [ -f dist/hardn.exe ] && bin=dist/hardn.exe
          "$bin" --version
          mkdir -p out && mv "$bin" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bin-${{ matrix.asset }}
          path: out/

  publish-pypi:
    needs: build
    # Opt-in: set repository variable PUBLISH_PYPI=true once PyPI Trusted Publishing is configured.
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi            # configure as a Trusted Publisher on pypi.org (no API token needed)
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - run: rm -f dist/hardn.pyz   # PyPI accepts only wheels and sdists
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only release artifacts; other jobs (e.g. CI's self-scan report) upload artifacts too.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bin-*
          path: assets
          merge-multiple: true
      - run: cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (e.g. drafted in the UI to publish on GitHub Marketplace).
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
