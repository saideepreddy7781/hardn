[build-system]
# Editable installs (`pip install -e .`) need pip 21.3 or newer (PEP 660). `pip install .` works on any pip.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentharden"
dynamic = ["version"]
description = "Offline security scanner that writes an AI-ready fix prompt and runs coding agents in a fix loop that a hostile repo cannot steer or game."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []  # stdlib only: installs and runs fully offline
keywords = ["security", "sast", "scanner", "secrets", "vulnerabilities", "osv", "ai", "llm", "devsecops", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/saideepreddy7781/agentharden"
Issues = "https://github.com/saideepreddy7781/agentharden/issues"
Changelog = "https://github.com/saideepreddy7781/agentharden/blob/main/CHANGELOG.md"

[project.scripts]
agentharden = "agentharden.cli:main"

[tool.setuptools]
packages = ["agentharden"]

[tool.setuptools.dynamic]
version = { attr = "agentharden.__version__" }

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# Explicit so results do not drift as ruff's defaults change between versions.
select = ["E4", "E7", "E9", "F", "I", "C4", "PLW1510", "FURB167", "UP"]
